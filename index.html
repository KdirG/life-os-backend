<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life OS Assistant</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
            --glass-bg: rgba(30, 41, 59, 0.45);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-glow: 0 0 25px rgba(99, 102, 241, 0.4);
            --neon-blue: #38bdf8;
            --neon-indigo: #6366f1;
            --neon-green: #10b981;
            --neon-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .header-area {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, var(--neon-blue), var(--neon-indigo));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Ayarlar İkonu */
        .settings-btn {
            position: absolute;
            right: 0;
            top: 8px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }

        .settings-btn svg {
            width: 24px;
            height: 24px;
            fill: #94a3b8;
            transition: fill 0.3s, transform 0.3s;
        }

        .settings-btn:hover svg {
            fill: #f8fafc;
            transform: rotate(45deg);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* Ayarlar Panel Slayt */
        .settings-panel {
            display: none;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: left;
            animation: slide-in 0.3s ease;
        }

        .settings-panel h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--neon-blue);
        }

        .settings-panel input {
            width: 100%;
            padding: 10px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            outline: none;
            margin-bottom: 10px;
        }

        .settings-panel button {
            padding: 8px 16px;
            background: var(--neon-indigo);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        /* Mikrofon Bölümü */
        .mic-section {
            margin: 20px 0;
            position: relative;
            display: inline-block;
        }

        .mic-btn {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-indigo), #4f46e5);
            border: none;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 2;
        }

        .mic-btn:active {
            transform: scale(0.92);
        }

        .mic-btn svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
            transition: all 0.3s ease;
        }

        .pulse-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 4px solid var(--neon-blue);
            opacity: 0;
            z-index: 1;
            box-sizing: border-box;
        }

        .recording .pulse-ring {
            animation: pulse-animation 1.5s infinite ease-out;
        }

        .recording .mic-btn {
            background: linear-gradient(135deg, var(--neon-red), #b91c1c);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        /* Giriş Bölümü */
        .input-section {
            margin-top: 15px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 14px;
            color: #f8fafc;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .send-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-indigo));
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--neon-blue);
            min-height: 20px;
            font-weight: 300;
        }

        /* --- BİLDİRİM MERKEZİ --- */
        .notification-card {
            text-align: left !important;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .notification-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .conn-status {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
        }

        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--neon-red);
            display: inline-block;
        }

        .conn-dot.online {
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
            animation: status-pulse 2s infinite;
        }

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .notification-list::-webkit-scrollbar {
            width: 4px;
        }
        .notification-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .notification-list::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 2px;
        }

        .empty-notifications {
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }

        .notification-item {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px;
            animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .notif-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notif-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--neon-blue);
        }

        .notif-time {
            font-size: 0.7rem;
            color: #64748b;
        }

        .notif-body {
            font-size: 0.85rem;
            color: #e2e8f0;
            line-height: 1.3;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @keyframes status-pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        @keyframes slide-in {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ana Panel (Kontrol) -->
        <div class="card">
            <div class="header-area">
                <h1>Life OS</h1>
                <button class="settings-btn" onclick="toggleSettingsPanel()">
                    <svg viewBox="0 0 24 24">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                    </svg>
                </button>
            </div>
            <p class="subtitle">AI Kişisel Yaşam & Otomasyon Asistanı</p>

            <!-- Dinamik Ayarlar Paneli -->
            <div class="settings-panel" id="settingsPanel">
                <h3>Backend Sunucu Ayarları</h3>
                <p style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px;">
                    Yerel test için bilgisayarınızın yerel IP adresini (örn: http://192.168.1.50:8000) veya ngrok adresini girin:
                </p>
                <input type="text" id="backendUrlInput" placeholder="http://localhost:8000">
                <button onclick="saveSettings()">Kaydet ve Yeniden Başlat</button>
            </div>

            <!-- Ses Kayıt Butonu -->
            <div class="mic-section" id="micContainer">
                <div class="pulse-ring"></div>
                <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
                    <svg viewBox="0 0 24 24" id="micIcon">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </button>
            </div>

            <!-- Yazı Giriş Bölümü -->
            <div class="input-section">
                <textarea id="textInput" placeholder="Yemek yedim, spor yaptım veya bir indirme linki girin..."></textarea>
                <button class="send-btn" onclick="sendText()">Gönder</button>
            </div>

            <div class="status-msg" id="statusMsg">Bağlantı aranıyor...</div>
        </div>

        <!-- Bildirim Merkezi Paneli -->
        <div class="card notification-card">
            <div class="notification-header">
                <h2>Bildirim Merkezi</h2>
                <span class="conn-status" id="connStatus">
                    <span class="conn-dot" id="connDot"></span>
                    <span id="connText">Çevrimdışı</span>
                </span>
            </div>
            <div class="notification-list" id="notificationList">
                <div class="empty-notifications" id="emptyNotif">Henüz bildirim alınmadı.</div>
            </div>
        </div>
    </div>

    <script>
        // BACKEND_URL Tespiti: Kayıtlı ayar varsa onu kullanır, yoksa otomatik tespit yapar
        let BACKEND_URL = localStorage.getItem('backend_url');
        if (!BACKEND_URL) {
            BACKEND_URL = (window.location.hostname && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1")
                ? "https://life-os-brain.onrender.com" // Dağıtıldığında Render URL'niz
                : "http://localhost:8000";
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let ntfyTopic = "";
        let eventSource = null;

        const micContainer = document.getElementById('micContainer');
        const statusMsg = document.getElementById('statusMsg');
        const notificationList = document.getElementById('notificationList');
        const emptyNotif = document.getElementById('emptyNotif');
        const connDot = document.getElementById('connDot');
        const connText = document.getElementById('connText');
        const settingsPanel = document.getElementById('settingsPanel');
        const backendUrlInput = document.getElementById('backendUrlInput');

        // Sayfa Yüklendiğinde
        window.addEventListener('DOMContentLoaded', () => {
            backendUrlInput.value = BACKEND_URL;

            // PWA Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        console.log("Service Worker aktif: ", reg.scope);
                        setupNativePush(reg);
                    })
                    .catch(err => console.error("Service Worker hatası: ", err));
            }

            // Tarayıcı Bildirim İzni İste
            if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                Notification.requestPermission();
            }

            // Backend bağlantısı kur ve config çek
            fetchBackendConfig();
        });

        // Ayarlar Paneli Aç/Kapat
        function toggleSettingsPanel() {
            if (settingsPanel.style.display === 'block') {
                settingsPanel.style.display = 'none';
            } else {
                settingsPanel.style.display = 'block';
            }
        }

        // Ayarları Kaydet
        function saveSettings() {
            const inputVal = backendUrlInput.value.trim();
            if (inputVal) {
                localStorage.setItem('backend_url', inputVal);
                BACKEND_URL = inputVal;
                statusMsg.innerText = "Ayarlar kaydedildi. Yeniden bağlanılıyor...";
                settingsPanel.style.display = 'none';
                
                // Yeniden başlat
                fetchBackendConfig();
            }
        }

        // --- NATIVE WEB PUSH ABONELİK İŞLEMLERİ ---
        async function setupNativePush(registration) {
            try {
                const response = await fetch(`${BACKEND_URL}/api/vapid-public-key`);
                if (!response.ok) throw new Error("VAPID key alınamadı");
                const data = await response.json();
                const publicVapidKey = data.public_key;

                if (!publicVapidKey) {
                    console.log("[WEB PUSH] VAPID public key bulunamadı.");
                    return;
                }

                if (Notification.permission !== "granted") {
                    const permission = await Notification.requestPermission();
                    if (permission !== "granted") {
                        console.log("[WEB PUSH] Bildirim izni reddedildi.");
                        return;
                    }
                }

                const convertedKey = urlBase64ToUint8Array(publicVapidKey);
                
                let subscription = await registration.pushManager.getSubscription();
                if (!subscription) {
                    subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: convertedKey
                    });
                    console.log("[WEB PUSH] Yeni abonelik oluşturuldu.");
                }

                await fetch(`${BACKEND_URL}/api/subscribe`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(subscription)
                });
                console.log("[WEB PUSH] Abonelik backend'e başarıyla kaydedildi.");
            } catch (err) {
                console.error("[WEB PUSH HATASI] Kurulum başarısız:", err);
            }
        }

        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/\-/g, '+')
                .replace(/_/g, '/');

            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);

            for (let i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        // Config çekme
        async function fetchBackendConfig() {
            try {
                const response = await fetch(`${BACKEND_URL}/api/config`);
                if (response.ok) {
                    const data = await response.json();
                    ntfyTopic = data.ntfy_topic;
                    statusMsg.innerText = "Sistem Bağlantısı Hazır.";
                    
                    if (ntfyTopic) {
                        connectToNotifications(ntfyTopic);
                    } else {
                        connText.innerText = "Konu Yok (.env)";
                    }
                } else {
                    statusMsg.innerText = "Sunucudan veri alınamadı.";
                }
            } catch (err) {
                console.error("Config hatası:", err);
                statusMsg.innerText = "Sunucuya bağlanılamadı. Ayarları ve sunucunuzu kontrol edin.";
                connDot.classList.remove('online');
                connText.innerText = "Bağlantı Yok";
            }
        }

        // ntfy.sh SSE Bağlantısı
        function connectToNotifications(topic) {
            if (eventSource) {
                eventSource.close();
            }

            eventSource = new EventSource(`https://ntfy.sh/${topic}/sse`);

            eventSource.onopen = () => {
                connDot.classList.add('online');
                connText.innerText = "Gözcü Aktif";
            };

            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.event === "message") {
                    addNotificationToList(data.title || "Life OS Güncellemesi", data.message, data.time);
                }
            };

            eventSource.onerror = (err) => {
                console.error("SSE Bağlantı Hatası:", err);
                connDot.classList.remove('online');
                connText.innerText = "Bağlantı Kesildi";
            };
        }

        function addNotificationToList(title, message, timestamp) {
            if (emptyNotif) {
                emptyNotif.style.display = 'none';
            }

            const timeStr = timestamp 
                ? new Date(timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const notifItem = document.createElement('div');
            notifItem.className = 'notification-item';
            notifItem.innerHTML = `
                <div class="notif-top">
                    <span class="notif-title">${title}</span>
                    <span class="notif-time">${timeStr}</span>
                </div>
                <div class="notif-body">${message}</div>
            `;

            notificationList.insertBefore(notifItem, notificationList.firstChild);

            if (notificationList.children.length > 11) {
                notificationList.removeChild(notificationList.lastChild);
            }
        }

        // Ses Kaydı Kontrolü
        async function toggleRecording() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    audioChunks = [];

                    mediaRecorder.addEventListener("dataavailable", event => {
                        audioChunks.push(event.data);
                    });

                    mediaRecorder.addEventListener("stop", () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        sendAudio(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    });

                    isRecording = true;
                    micContainer.classList.add('recording');
                    statusMsg.innerText = "Dinleniyor... Durdurmak için dokunun.";
                } catch (err) {
                    console.error("Mikrofon hatası:", err);
                    statusMsg.innerText = "Mikrofon izni alınamadı.";
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micContainer.classList.remove('recording');
                statusMsg.innerText = "Ses çözümleniyor...";
            }
        }

        async function sendAudio(blob) {
            const formData = new FormData();
            formData.append("audio", blob, "voice.webm");

            try {
                const response = await fetch(`${BACKEND_URL}/api/process`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                handleResponse(data);
            } catch (err) {
                console.error("İstek hatası:", err);
                statusMsg.innerText = "Sunucu bağlantı hatası.";
            }
        }

        async function sendText() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) return;

            statusMsg.innerText = "Gönderiliyor...";
            const formData = new FormData();
            formData.append("text", text);

            try {
                const response = await fetch(`${BACKEND_URL}/api/process`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                handleResponse(data);
            } catch (err) {
                console.error("İstek hatası:", err);
                statusMsg.innerText = "Sunucu bağlantı hatası.";
            }
        }

        function handleResponse(data) {
            if (data.status === "success") {
                statusMsg.innerText = `Başarılı! Niyet: ${data.intent.toUpperCase()}`;
                document.getElementById('textInput').value = "";
                setTimeout(() => {
                    statusMsg.innerText = "Sistem Bağlantısı Hazır.";
                }, 3000);
            } else {
                statusMsg.innerText = "İşlem hatası.";
            }
        }
    </script>
</body>
</html>
